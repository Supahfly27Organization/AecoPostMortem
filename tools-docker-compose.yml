name: mcp-tools
services:
  postgres:
    image: postgres:17
    container_name: sonar-postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - ./sonar/sonar_postgres_data:/var/lib/postgresql/data
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - ./sonar/sonarqube_data:/opt/sonarqube/data
      - ./sonar/sonarqube_extensions:/opt/sonarqube/extensions
      - ./sonar/sonarqube_logs:/opt/sonarqube/logs
    networks:
      - mcp-net

  semgrep-mcp:
    image: semgrep/semgrep:latest
    container_name: semgrep-mcp
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["sleep"]
    command: ["infinity"]
    networks:
      - mcp-net

  trivy-mcp:
    image: aquasec/trivy:latest
    container_name: trivy-mcp
    volumes:
      - .:/workspace
      - ./trivy/cache:/root/.cache/trivy
      - ./trivy/plugins:/root/.trivy/plugins
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["trivy plugin install mcp && trivy mcp"]
    stdin_open: true
    tty: false
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
